[package]
name = "shuttle-sftp"
version = "0.3.0"
edition = "2021"
description = "ShuttleSFTP - Cross-platform SFTP/SCP file transfer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.62"
russh-sftp = "2.3"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
